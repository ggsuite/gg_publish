name: gg_publish
description: Various tools and checks for publishing dart packages, e.g. versioning, checks etc.
version: 4.4.1
repository: https://github.com/inlavigo/gg_publish.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.2.0
  gg_console_colors: ^2.4.0
  gg_is_flutter: ^2.2.0
  gg_lang: ^0.6.1
  gg_log: ^1.2.0
  gg_process: ^1.2.0
  gg_status_printer: ^1.6.0
  # WriteVersionFile was added in 4.6.0. gg_version must be published with a
  # »minor« increment, otherwise this constraint cannot be satisfied.
  gg_version: ^5.4.0
  http: ^1.6.0
  matcher: ^0.12.20
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.1
  gg_git: ^4.3.0
dev_dependencies:
  dna_ggsuite: ^0.2.0
  fake_async: ^1.3.3
  gg_capture_print: ^1.1.0
  helix: ^1.3.0
  lints: ^6.1.0
  test: ^1.31.2

executables:
  gg_publish: